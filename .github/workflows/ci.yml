name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4.3
        env: { MYSQL_DATABASE: helpdesk, MYSQL_USER: helpdesk, MYSQL_PASSWORD: ci-only-pw, MYSQL_ROOT_PASSWORD: ci-root-pw }
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 --silent" --health-interval 5s --health-retries 30
    env:
      DB_HOST: 127.0.0.1
      DB_PASSWORD: ci-only-pw
      JWT_SECRET: ci-only-secret-not-for-production
      DEMO_MODE: "true"
      DEMO_CLOCK_START: 2026-11-04T11:46:00+05:30
      AI_PROVIDER: rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20.18.1 }
      - run: npm --prefix backend ci && npm --prefix frontend ci
      - run: npm --prefix backend run lint && npm --prefix frontend run lint
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix backend test
      - run: npm --prefix frontend test
      - run: npm --prefix backend run db:migrate && npm --prefix backend run db:seed
      - run: npm --prefix backend run test:e2e
      - run: npm --prefix backend run build && npm --prefix frontend run build
      - run: npx --prefix frontend playwright install --with-deps chromium
      - name: Playwright flows
        run: |
          (cd backend && node dist/main.js &) 
          (cd frontend && npx vite preview --port 5173 &)
          npx wait-on@8.0.1 http://localhost:3000/api/health http://localhost:5173
          npm --prefix frontend run e2e
